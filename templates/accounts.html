{% extends 'base.html' %}{% block body %}<h1>メールアカウント設定</h1><form method="post" action="{{url_for('mail_seconds')}}"><label>メール確認間隔（秒）<input name="seconds" type="number" min="1" value="{{seconds}}"></label><button>更新</button></form>
<h2>新規登録</h2><form method="post"><input name="id" placeholder="ID" required><input name="email" placeholder="メールアドレス" required><input name="account" placeholder="ログインID" required><input name="password" type="password" placeholder="パスワード" required><input name="server" placeholder="サーバー" required><select name="protocol"><option value="0">POP</option><option value="1">IMAP</option></select><select name="encrypt"><option value="0">非暗号</option><option value="1">TLS</option><option value="2">STARTTLS</option></select><input name="port" type="number" value="993" required><button>登録</button></form>
<table><tr><th>ID</th><th>メール</th><th>サーバー</th><th>操作</th></tr>{% for row in accounts %}<tr><td>{{row.id}}</td><td>{{row.email}}</td><td>{{row.server}}:{{row.port}}</td><td><a href="{{url_for('edit_account', account_id=row.id)}}">編集</a><form method="post" action="{{url_for('delete_account', account_id=row.id)}}"><button>削除</button></form></td></tr>{% endfor %}</table>{% endblock %}
