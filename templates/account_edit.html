{% extends 'base.html' %}{% block body %}<h1>メールアカウント編集</h1><form method="post"><input name="id" type="hidden" value="{{account.id}}"><input name="email" value="{{account.email}}" required><input name="account" value="{{account.account}}" required><input name="password" type="password" value="{{account.password}}" required><input name="server" value="{{account.server}}" required><select name="protocol"><option value="0">POP</option><option value="1" {% if account.protocol == 1 %}selected{% endif %}>IMAP</option></select><select name="encrypt"><option value="0">非暗号</option><option value="1" {% if account.encrypt == 1 %}selected{% endif %}>TLS</option><option value="2" {% if account.encrypt == 2 %}selected{% endif %}>STARTTLS</option></select><input name="port" type="number" value="{{account.port}}" required><button>更新</button></form>{% endblock %}
