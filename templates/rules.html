{% extends 'base.html' %}{% block body %}<h1>抽出ルール設定</h1><form method="post"><input name="name" placeholder="名前" required><input name="description" placeholder="説明"><input name="fromRegex" placeholder="送信元正規表現" required><input name="subjectRegex" placeholder="件名正規表現" required><input name="extractRegex" placeholder="OTP正規表現" required><input name="expiration" type="number" min="1" placeholder="有効期限（秒）" required><button>登録</button></form><table><tr><th>ID</th><th>名前</th><th>説明</th><th>操作</th></tr>{% for row in rules %}<tr><td>{{row.id}}</td><td>{{row.name}}</td><td>{{row.description}}</td><td><a href="{{url_for('edit_rule', rule_id=row.id)}}">編集</a><form method="post" action="{{url_for('delete_rule', rule_id=row.id)}}"><button>削除</button></form></td></tr>{% endfor %}</table>{% endblock %}
