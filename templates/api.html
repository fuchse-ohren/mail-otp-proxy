{% extends 'base.html' %}{% block body %}<h1>API 設定</h1>{% if new_key %}<p><strong>新しい API キー（再表示されません）: {{new_key}}</strong></p>{% endif %}<form method="post"><input name="descriptions" placeholder="説明"><button>APIキー発行</button></form><table><tr><th>説明</th><th>作成時刻</th><th>操作</th></tr>{% for row in keys %}<tr><td>{{row.descriptions}}</td><td>{{row.created_at}}</td><td><form method="post" action="{{url_for('delete_key', key_id=row.rowid)}}"><button>削除</button></form></td></tr>{% endfor %}</table>{% endblock %}
